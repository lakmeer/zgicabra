[package]
name = "zgicabra"
version = "0.1.0"
edition = "2021"
authors = [ "lakmeer.github.com" ]

[dependencies]
drawille = "0.3.0"
lazy_static = "1.4.0"
libc = "0.2.139"
rand = "0.8.5"
rand_distr = "0.4.3"
rgb = "0.8.35"
termion = "2.0.1"
textplots = "0.8.7"
rosc = "~0.10"
fundsp = "0.23.0"
num-complex = { version = "0.4.6", default-features = false, features = ["libm"] }
cpal = "0.18.1"
nam-rs = "0.4.0"
imgui = { version = "0.12", features = ["tables-api"] }
imgui-winit-support = "0.13"
imgui-glow-renderer = "0.13"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.14"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

# Native USB HID backend for the Hydra on macOS (see src/hydra/hid.rs) -- the
# vendored Sixense SDK is Linux-only and dead anyway, so this never needs to
# exist on other targets.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
hidapi = "2"

# imgui-rs 0.12's DrawData::cmd_lists() calls slice::from_raw_parts on a
# possibly-null pointer when a draw list is empty; harmless in Dear ImGui's C++
# but trips Rust's debug-only UB precondition checks (stable since ~1.80).
# Release builds skip these checks, so this only matters for `cargo build`
# without --release. Upstream issue: imgui-rs/imgui-rs, unfixed as of 0.12.0.
[profile.dev]
debug-assertions = false
