[package]
name = "zgicabra"
version = "0.1.0"
edition = "2021"
authors = [ "lakmeer.github.com" ]

[dependencies]
drawille = "0.3.0"
lazy_static = "1.4.0"
libc = "0.2.139"
rand = "0.8.5"
rand_distr = "0.4.3"
rgb = "0.8.35"
termion = "2.0.1"
fundsp = { version = "0.23.0", default-features = false, features = ["std", "files"] }
num-complex = { version = "0.4.6", default-features = false, features = ["libm"] }
cpal = "0.18.1"
nam-rs = "0.4.0"
rtrb = "0.3"
include_dir = "0.7"

# Native USB HID backend for the Hydra on macOS (see src/hydra/hid.rs) -- the
# vendored Sixense SDK is Linux-only and dead anyway, so this never needs to
# exist on other targets, real-hardware-only.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
hidapi = "2"

# midir supplements missing real hardware with MIDI controller input on the
# macOS dev machine (see src/hydra/mock.rs), and also backs the CC live-tuning
# pipeline (src/audio/cc_input.rs) on both machines -- cpal (unconditional
# dependency, see above) already requires and gets ALSA on the Linux
# performance rig, so midir builds fine there too.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
midir = "0.11.0"
